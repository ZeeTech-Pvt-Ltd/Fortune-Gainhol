    <!-- Open Graph / Twitter (defaults; per-route values are set via useMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fortune Gainhol" />
    <meta property="og:title" content="Fortune Gainhol - AI-Powered Trading Platform" />

    />

    <!-- Fonts: Fraunces (display serif) + Inter (body) - heritage fortune.
         Static instances instead of the full variable axes (500..700 x
         optical sizing) - the variable files were ~146KB and slowed LCP.
         Loaded non-blocking so the stylesheet doesn't delay first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: no font swap after first paint, so no CLS.
         The preloaded stylesheet makes the fonts available early on
         normal connections; slow connections get the Georgia fallback. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=optional"
      />
    </noscript>
